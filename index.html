<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bamberg – En Ucuz Bira</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #eee;
      font-family: 'Georgia', serif;
      min-height: 100vh;
    }

    header {
      background: #1c1000;
      border-bottom: 2px solid #b07800;
      padding: 1.6rem 1.2rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    header h1 { font-size: 1.5rem; color: #f5c842; }
    header p  { font-size: 0.8rem; color: #886644; margin-top: 0.2rem; }

    .lang-switcher { display: flex; gap: 0.4rem; }

    .lang-btn {
      background: #2a1500;
      border: 1px solid #5a3a10;
      border-radius: 5px;
      color: #c8a87a;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 0.25rem 0.55rem;
    }
    .lang-btn.active { background: #4a2800; border-color: #b07800; color: #f5c842; }

    main { max-width: 560px; margin: 2rem auto; padding: 0 1rem; }

    .list-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #664422;
      padding: 0 0.2rem 0.5rem;
      border-bottom: 1px solid #2a1a00;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.9rem 0.2rem;
      border-bottom: 1px solid #1e1200;
    }

    .item:hover { background: #1a0e00; }

    .rank {
      color: #4a3020;
      font-size: 0.8rem;
      width: 1.4rem;
      flex-shrink: 0;
    }

    .name-wrap { flex: 1; display: flex; flex-direction: column; gap: 0.15rem; text-decoration: none; }
    .name { font-size: 1rem; color: #e8d0b0; }
    .name-wrap:hover .name { color: #f5c842; text-decoration: underline; }
    .beer-type { font-size: 0.72rem; color: #5a3a18; }

    .price {
      font-size: 1.1rem;
      font-weight: bold;
      color: #f5c842;
      text-align: right;
      min-width: 60px;
    }

    .price.approx { color: #a08040; }

    .note {
      margin-top: 2rem;
      font-size: 0.72rem;
      color: #443322;
      text-align: center;
    }

    footer { text-align: center; padding: 2rem; color: #332211; font-size: 0.75rem; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>🍺 <span data-i18n="title"></span></h1>
    <p data-i18n="subtitle"></p>
  </div>
  <div class="lang-switcher">
    <button class="lang-btn active" onclick="setLang('tr')">TR</button>
    <button class="lang-btn" onclick="setLang('en')">EN</button>
    <button class="lang-btn" onclick="setLang('de')">DE</button>
  </div>
</header>

<main>
  <div class="list-header">
    <span data-i18n="col_place"></span>
    <span data-i18n="col_price"></span>
  </div>

  <div id="list"></div>

  <p class="note" data-i18n="note"></p>
</main>

<footer>Prost! 🍺 Bamberg</footer>

<script>
const places = [
  { name: "Keesmann Bräu",      beer: "Herren Pils 0.5L",      price: 3.90, approx: true,  maps: "https://maps.google.com/?q=Keesmann+Br%C3%A4u+Bamberg" },
  { name: "Mahr's Bräu",        beer: "Ungespundetes 0.5L",    price: 4.10, approx: true,  maps: "https://maps.google.com/?q=Mahr%27s+Br%C3%A4u+Bamberg" },
  { name: "Spezial",            beer: "Rauchbier Lager 0.5L",  price: 4.10, approx: true,  maps: "https://maps.google.com/?q=Brauerei+Spezial+Bamberg" },
  { name: "Fässla Brauerei",    beer: "Lagerbier 0.5L",        price: 4.20, approx: true,  maps: "https://maps.google.com/?q=F%C3%A4ssla+Brauerei+Bamberg" },
  { name: "Schlenkerla",        beer: "Rauchbier Märzen 0.5L", price: 4.30, approx: false, maps: "https://maps.google.com/?q=Schlenkerla+Bamberg" },
  { name: "Klosterbräu",        beer: "Lagerbier 0.5L",        price: 4.40, approx: true,  maps: "https://maps.google.com/?q=Klosterbraeu+Bamberg" },
  { name: "Greifenklau Keller", beer: "Kellerbier 0.5L",       price: 4.40, approx: true,  maps: "https://maps.google.com/?q=Greifenklau+Keller+Bamberg" },
  { name: "Ambräusianum",       beer: "Hausbier 0.5L",         price: 4.80, approx: true,  maps: "https://maps.google.com/?q=Ambr%C3%A4usianum+Bamberg" },
];

const i18n = {
  tr: {
    title: "Bamberg En Ucuz Bira",
    subtitle: "En ucuzdan en pahalıya",
    col_place: "Mekan", col_price: "Fiyat",
    note: "~ işaretli fiyatlar tahminidir. Doğrulamak için mekana sorun.",
  },
  en: {
    title: "Bamberg Cheapest Beer",
    subtitle: "Cheapest to most expensive",
    col_place: "Pub", col_price: "Price",
    note: "Prices marked ~ are estimates. Verify on-site.",
  },
  de: {
    title: "Bamberg Günstigstes Bier",
    subtitle: "Günstig bis teuer",
    col_place: "Lokal", col_price: "Preis",
    note: "Mit ~ markierte Preise sind Schätzungen. Vor Ort prüfen.",
  }
};

function renderList() {
  const sorted = [...places].sort((a, b) => a.price - b.price);
  document.getElementById('list').innerHTML = sorted.map((p, i) => `
    <div class="item">
      <span class="rank">${i + 1}.</span>
      <a class="name-wrap" href="${p.maps}" target="_blank" rel="noopener">
        <span class="name">${p.name}</span>
        <span class="beer-type">${p.beer}</span>
      </a>
      <span class="price ${p.approx ? 'approx' : ''}">${p.approx ? '~' : ''}€${p.price.toFixed(2)}</span>
    </div>
  `).join('');
}

function setLang(lang) {
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.textContent === lang.toUpperCase()));
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (i18n[lang][key]) el.textContent = i18n[lang][key];
  });
  document.documentElement.lang = lang;
}

renderList();
setLang('tr');
</script>

</body>
</html>
